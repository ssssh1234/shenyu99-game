<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百家乐 · 曜石娱乐</title><style>
*{box-sizing:border-box}body{margin:0;background:#09110f;color:#ecf4ef;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:0 20px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.top a{color:#b5d9ca;text-decoration:none;font-size:13px}.tag{font-size:10px;color:#e8bd69;border:1px solid #e8bd6955;padding:6px 9px;border-radius:15px}.title{padding:27px 0 18px}.title h1{font-size:24px;margin:0 0 7px}.title p{color:#889a91;font-size:12px;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:15px}.panel{border:1px solid #293c34;border-radius:9px;background:linear-gradient(140deg,#14221c,#101916);padding:17px}.video{height:295px;border:1px solid #3e6654;border-radius:8px;background:radial-gradient(ellipse,#28694e,#14412e 62%,#0a2018);display:grid;place-items:center;position:relative;overflow:hidden}.video:before{content:"";position:absolute;width:70%;height:72%;border:1px solid #ffffff22;border-radius:50%}.dealer{position:relative;text-align:center}.dealer strong{display:block;font-size:14px;margin-top:8px}.dealer small{display:block;color:#bbd5c9;font-size:10px;margin-top:4px}.dealer-icon{font-size:65px}.live{position:absolute;left:12px;top:11px;font-size:10px;background:#0005;padding:6px 8px;border-radius:4px}.live i{display:inline-block;background:#f66;width:6px;height:6px;border-radius:100%;margin-right:6px}.cards{display:flex;justify-content:center;align-items:center;gap:45px;padding:19px 0}.hand{text-align:center;min-width:140px}.hand label{display:block;color:#adc0b6;font-size:11px;margin-bottom:8px}.card{display:inline-grid;place-items:center;width:45px;height:64px;border-radius:5px;background:#f4f0e8;color:#1d2723;font-size:17px;font-weight:800;margin:0 3px;box-shadow:0 3px 8px #0006}.card.red{color:#d84453}.score{margin-top:7px;font-size:11px;color:#d7e0db}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.bet{cursor:pointer;border:1px solid #405249;background:#17251e;border-radius:6px;padding:12px;color:#edf4ef;text-align:left}.bet:hover,.bet.selected{border-color:#3ed6a1;background:#18372c}.bet b{display:block;font-size:12px}.bet small{color:#8b9b92;font-size:10px;display:block;margin-top:6px}.controls{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}.chip{background:#1b2a23;border:1px solid #415348;border-radius:18px;color:#d3e0d8;padding:7px 11px;font-size:11px;cursor:pointer}.chip.active{border-color:#e8bd69;color:#e8bd69}.confirm{margin-left:auto;background:#35d19a;color:#05261c;font-weight:800;border:0;padding:10px 15px;border-radius:4px;cursor:pointer}.road{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.dot{width:19px;height:19px;border:1px solid #ef7884;border-radius:50%;color:#ff9ba5;display:grid;place-items:center;font-size:8px}.dot.p{border-color:#82afff;color:#a9caff}.dot.t{border-color:#4bd7a7;color:#75e6bc}.side h2{font-size:13px;margin:0 0 14px}.history{font-size:11px;color:#cbd7d0;line-height:2.4;border-top:1px solid #ffffff12;margin-top:14px;padding-top:7px}.note{font-size:10px;color:#81938a;line-height:1.8;margin:15px 0 0}.foot{text-align:center;color:#596961;font-size:10px;padding:20px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.video{height:240px}}@media(max-width:480px){.wrap{padding:0 11px}.panel{padding:12px}.cards{gap:8px}.hand{min-width:110px}.options{gap:5px}.bet{padding:10px 7px}.side{grid-template-columns:1fr}}
.lobby{padding:38px 0 25px}.lobby-head{text-align:center;margin-bottom:22px}.lobby-head small{font-size:10px;letter-spacing:.2em;color:#71d4aa}.lobby-head h1{font-size:25px;margin:8px 0}.lobby-head p{font-size:12px;color:#8ea399}.room-list{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.room-card{border:1px solid #30493d;border-radius:9px;background:linear-gradient(145deg,#17251e,#101916);color:#edf4ef;text-align:left;padding:10px;cursor:pointer;transition:.18s}.room-card:hover{transform:translateY(-3px);border-color:#56d8a6;box-shadow:0 9px 25px #0007}.room-art{height:125px;border-radius:6px;display:grid;place-items:center;font-size:48px;margin-bottom:12px}.room-art.jade{background:radial-gradient(#27795c,#12382e)}.room-art.sapphire{background:radial-gradient(#3676ae,#172b4b)}.room-art.neon{background:radial-gradient(#894d9b,#292039)}.room-card strong,.room-card small,.room-card i{display:block}.room-card strong{font-size:14px}.room-card small{font-size:10px;color:#94a49a;margin-top:5px}.room-card i{font-size:10px;color:#76ddb4;font-style:normal;margin-top:12px}.layout.sapphire .video{background:radial-gradient(ellipse,#3676ae,#173959 62%,#101c2d)}.layout.neon .video{background:radial-gradient(ellipse,#894d9b,#47264f 62%,#171321)}@media(max-width:640px){.room-list{grid-template-columns:1fr}.room-art{height:88px}.lobby{padding:22px 0}}</style></head><body><div class="wrap"><header class="top"><a href="index.html">← 主页</a><button id="changeRoom" class="tag" style="display:none;cursor:pointer">切换桌台</button><span class="tag">百家乐独立应用 · 虚拟积分</span></header><section id="baccaratLobby" class="lobby"><div class="lobby-head"><small>BACCARAT ROOMS</small><h1>选择百家乐桌台</h1><p>选择桌台进入；后续可在这里添加不同规则和特色玩法。</p></div><div class="room-list"><button class="room-card" data-room="jade"><span class="room-art jade">♠</span><strong>翡翠经典桌</strong><small>经典百家乐 · 真人荷官位</small><i>进入桌台 →</i></button><button class="room-card" data-room="sapphire"><span class="room-art sapphire">♦</span><strong>蓝钻贵宾桌</strong><small>蓝钻主题 · 独立桌台</small><i>进入桌台 →</i></button><button class="room-card" data-room="neon"><span class="room-art neon">♣</span><strong>霓虹极速桌</strong><small>霓虹主题 · 独立桌台</small><i>进入桌台 →</i></button></div></section><section class="title" style="display:none"><h1 id="roomTitle">翡翠厅 · 真人百家乐</h1><p>独立桌台演示　·　试玩积分 <b id="balance">10,000</b></p></section><main class="layout" id="tableGame" style="display:none"><section class="panel"><div class="video"><span class="live"><i></i>LIVE · 演示桌</span><div class="dealer"><div class="dealer-icon">🃏</div><strong>荷官直播画面</strong><small>连接授权真人桌台视频后在此播放</small></div></div><div class="cards"><div class="hand"><label>闲家 · PLAYER</label><div id="playerCards"></div><div class="score">点数 <b id="playerScore">—</b></div></div><div style="color:#82968b;font-size:10px">VS</div><div class="hand"><label>庄家 · BANKER</label><div id="bankerCards"></div><div class="score">点数 <b id="bankerScore">—</b>　<b id="outcome"></b></div></div></div><div class="options"><button class="bet" data-side="player"><b style="color:#94baff">闲家</b><small>赔率 1 : 1</small></button><button class="bet" data-side="banker"><b style="color:#ff9aa3">庄家</b><small>赔率 0.95 : 1</small></button><button class="bet" data-side="tie"><b style="color:#55dcae">和局</b><small>赔率 8 : 1</small></button></div><div class="controls"><span style="font-size:10px;color:#9aac9f">投注</span><button class="chip active" data-amount="100">100</button><button class="chip" data-amount="500">500</button><button class="chip" data-amount="1000">1,000</button><button class="confirm" id="submit">选择投注</button></div></section><aside class="panel side"><div><h2>牌路记录</h2><div id="road" class="road"></div><div class="history" id="history">新牌局等待投注</div></div><div><h2>独立桌台说明</h2><p class="note">本页面与其他游戏分开运行。当前为演示发牌逻辑；真实荷官视频、牌桌结果及在线投注须接入持牌服务商提供的接口。</p></div></aside></main><footer class="foot">纯前端演示 · 虚拟积分无现金价值</footer></div>
<script>let balance=10000,amount=100,side='';const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);function show(){ $('#balance').textContent=balance.toLocaleString()}$$('.bet').forEach(b=>b.onclick=()=>{$$('.bet').forEach(x=>x.classList.toggle('selected',x===b));side=b.dataset.side;$('#submit').textContent='投注 '+amount});$$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.toggle('active',x===c));amount=+c.dataset.amount;$('#submit').textContent=side?'投注 '+amount:'选择投注'});function cards(root,n){let suits=['♠','♥','♦','♣'];root.innerHTML='';for(let i=0;i<2;i++){let v=Math.random()*13|0+1;let value=Math.floor(Math.random()*13)+1;let rank=value>10?'K':value===1?'A':value;let el=document.createElement('span');el.className='card '+(i%2?'red':'');el.innerHTML=rank+'<br>'+suits[Math.random()*4|0];root.appendChild(el)}return n}$('#submit').onclick=()=>{if(!side)return $('#history').textContent='请先选择投注选项';if(balance<amount)return $('#history').textContent='试玩积分不足';balance-=amount;let p=Math.floor(Math.random()*10),b=Math.floor(Math.random()*10),winner=p===b?'tie':p>b?'player':'banker';$('#playerScore').textContent=p;$('#bankerScore').textContent=b;cards($('#playerCards'));cards($('#bankerCards'));$('#outcome').textContent=winner==='tie'?'和':winner==='player'?'闲胜':'庄胜';if(winner===side){let prize=winner==='tie'?amount*8:winner==='banker'?amount*1.95:amount*2;balance+=prize;$('#history').textContent='本局命中，赢得 '+prize+' 虚拟积分'}else $('#history').textContent='本局未中，再试一次';let d=document.createElement('span');d.className='dot '+(winner==='player'?'p':winner==='tie'?'t':'');d.textContent=winner==='player'?'闲':winner==='tie'?'和':'庄';$('#road').prepend(d);if($('#road').children.length>24)$('#road').lastChild.remove();show()};for(let i=0;i<18;i++){let d=document.createElement('span');d.className='dot '+(['p','','','','p','t','','p'][i%8]);d.textContent=d.classList.contains('p')?'闲':d.classList.contains('t')?'和':'庄';$('#road').appendChild(d)}show();const roomData={jade:{title:'翡翠厅 · 真人百家乐',theme:''},sapphire:{title:'蓝钻厅 · 真人百家乐',theme:'sapphire'},neon:{title:'霓虹厅 · 真人百家乐',theme:'neon'}};document.querySelectorAll('.room-card').forEach(card=>card.onclick=()=>{let room=roomData[card.dataset.room];$('#roomTitle').textContent=room.title;$('#tableGame').classList.remove('sapphire','neon');if(room.theme)$('#tableGame').classList.add(room.theme);$('#baccaratLobby').style.display='none';document.querySelector('.title').style.display='block';$('#tableGame').style.display='grid';$('#changeRoom').style.display='inline-block'});$('#changeRoom').onclick=()=>{$('#tableGame').style.display='none';document.querySelector('.title').style.display='none';$('#baccaratLobby').style.display='block';$('#changeRoom').style.display='none'};</script></body></html>
