</style></head><body class="lobby-mode"><div class="wrap"><header class="top"><button id="openLobby" class="flag switch-game" style="display:none;cursor:pointer">切换游戏</button><div class="brand"><span>糖果老虎机</span></div><span class="flag status-flag">独立应用 · 虚拟积分</span><a class="home-link" href="index.html">返回主页</a></header><section id="slotLobby" class="lobby"><div class="lobby-title"><small>SLOT ARCADE</small><h1>选择老虎机玩法</h1><p>每款游戏独立呈现；后续可在这里继续添加新主题。</p></div><div class="game-options"><button class="game-option" data-theme="sweet"><span class="cover sweet">🍬</span><strong>糖果甜心</strong><small>糖果连消 · 经典玩法</small><i>进入游戏　→</i></button><button class="game-option" data-theme="ocean"><span class="cover ocean">🐠</span><strong>深海宝藏</strong><small>经典转轴 · 5 轴 5 行</small><i>进入游戏　→</i></button><button class="game-option" data-theme="cosmic"><span class="cover cosmic">🪐</span><strong>银河糖果</strong><small>星际糖果 · 连消玩法</small><i>进入游戏　→</i></button></div></section><main class="machine" id="machine" style="display:none"><div class="title"><strong id="gameTitle">SWEET<br>SPIN</strong><small id="gameSubtitle">糖果连消 · 独立演示桌</small></div><div class="stats"><span><i id="metricLabel" style="font-style:normal">当前倍率</i> <b id="multiplier">0×</b></span><button type="button" class="sound-toggle" id="soundToggle" aria-pressed="true">🔊 音效开</button></div><div class="board" id="board" aria-label="老虎机盘面"></div><div class="result" id="result">5 个相连的同种糖果即可消除</div><div class="controls"><div class="bottom-row"><div class="prize-box"><span>中奖金额</span><strong id="winAmount">RM 0.00</strong></div><div class="bet-picker" id="betPicker"><button type="button" class="bet-current" id="betCurrent" aria-expanded="false">投注金额　RM 0.20　⌄</button><div class="bet-options" id="betOptions" role="group" aria-label="选择投注金额"><button type="button" data-wager="0.2" class="active">RM 0.20</button><button type="button" data-wager="0.5">RM 0.50</button><button type="button" data-wager="1">RM 1</button><button type="button" data-wager="2">RM 2</button><button type="button" data-wager="5">RM 5</button><button type="button" data-wager="10">RM 10</button><button type="button" data-wager="20">RM 20</button><button type="button" data-wager="30">RM 30</button><button type="button" data-wager="50">RM 50</button><button type="button" data-wager="75">RM 75</button><button type="button" data-wager="100">RM 100</button><button type="button" data-wager="125">RM 125</button><button type="button" data-wager="150">RM 150</button></div></div></div><div class="spin-row"><div class="balance-box"><span>余额</span><strong id="balance">RM 34.21</strong></div><button class="spin" id="spin">旋转　↻</button><span class="spin-spacer" aria-hidden="true"></span></div><div class="free" id="free"></div><button class="buy-free" id="buyFree" type="button">购买 10 次免费游戏（投注额 × 100） · RM 20.00</button></div></main><p class="rules" id="rules">相同糖果须上下或左右相连成组，5 个起可消除。每轮连锁倍率为 2×、4×、6×、8×、10×……；所有中奖格都会留下该轮倍率标记。中奖糖果消失后，同列糖果下落、顶部补入新糖果，并继续检查连锁。纯演示，不涉及真实交易。</p></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),symbols=['🍬','🍭','🍡','🍩','🍒','🍇','🍓'],boardEl=$('#board');let currentTheme="sweet",wager=.2,freeCount=Number(localStorage.getItem('slotFreeCount')||0),paidCount=Number(localStorage.getItem('slotPaidCount')||0),purchaseCount=Number(localStorage.getItem('slotPurchaseCount')||0),balance=Number(localStorage.getItem('slotBalance')||0),busy=false,freeAutoBusy=false,audioContext=null,soundEnabled=localStorage.getItem('slotSoundEnabled')!=='false',spinSoundTimer=null,spinSoundStep=0;if(!localStorage.getItem('slotInitialTestBalance')){balance=Math.max(balance,10000);localStorage.setItem('slotBalance',balance);localStorage.setItem('slotInitialTestBalance','1')}
function getAudio(){if(!soundEnabled)return null;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return null;if(!audioContext)audioContext=new AudioCtx();if(audioContext.state==='suspended')audioContext.resume();return audioContext}function playTone(frequency,duration=.09,when=0,type='sine',volume=.045,endFrequency=frequency){const ctx=getAudio();if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+when;osc.type=type;osc.frequency.setValueAtTime(frequency,start);if(endFrequency!==frequency)osc.frequency.exponentialRampToValueAtTime(Math.max(30,endFrequency),start+duration);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+duration+.02)}function startSpinSound(){if(!getAudio())return;clearInterval(spinSoundTimer);spinSoundStep=0;const tick=()=>{if(!soundEnabled)return;const f=360+(spinSoundStep%7)*48;playTone(f,.075,0,'triangle',.025,f+70);spinSoundStep++};tick();spinSoundTimer=setInterval(tick,120)}function stopSpinSound(){clearInterval(spinSoundTimer);spinSoundTimer=null;if(soundEnabled)playTone(620,.12,0,'triangle',.035,400)}function playWinSound(){if(!getAudio())return;[523,659,784,1047].forEach((f,i)=>playTone(f,.32,i*.11,'sine',.055,f*1.015))}function updateSoundButton(){const b=#soundToggle;if(!b)return;b.textContent=soundEnabled?'🔊 音效开':'🔇 音效关';b.setAttribute('aria-pressed',String(soundEnabled))}function money(n){return 'RM '+n.toFixed(2)}function showBalance(){$('#balance').textContent=money(balance)}function showFree(){$('#free').textContent=freeCount?`免费游戏剩余 ${freeCount} 次`:''}function updateBuyFree(){const b=document.querySelector("#buyFree");if(b)b.textContent="购买 10 次免费游戏（投注额 × 100） · RM "+(wager*100).toFixed(2)}function pause(ms){return new Promise(r=>setTimeout(r,ms))}function randomBoard(){return Array.from({length:currentTheme==='ocean'?25:30},()=>symbols[Math.random()*symbols.length|0])}function classicHasWin(board){return board[11]===board[10]&&board[12]===board[10]}function randomClassicBoard(){const shouldWin=Math.random()<.5;let board;do{board=randomBoard()}while(classicHasWin(board)!==shouldWin);return board}function randomCandyBoard(){const shouldWin=Math.random()<.5;let board;do{board=randomBoard()}while((matches(board).length>0)!==shouldWin);return board}
function render(board,marks=[],falls=[]){boardEl.classList.toggle('classic',currentTheme==='ocean');boardEl.innerHTML='';board.forEach((symbol,i)=>{let c=document.createElement('div');c.className='cell';c.textContent=symbol;c.style.setProperty('--i',i+1);if(falls[i]!==undefined)c.style.setProperty('--fromY',falls[i]+'px');if(marks[i]){let badge=document.createElement('span');badge.className='token';badge.textContent=marks[i]+'×';c.appendChild(badge)}boardEl.appendChild(c)});boardEl.classList.add('drop');requestAnimationFrame(()=>requestAnimationFrame(()=>boardEl.classList.remove('drop')))}
function matches(board){let seen=new Set(),wins=[];for(let start=0;start<30;start++){if(seen.has(start))continue;let symbol=board[start],stack=[start],group=[];seen.add(start);while(stack.length){let i=stack.pop();group.push(i);[i%6?i-1:-1,i%6<5?i+1:-1,i-6,i+6].forEach(n=>{if(n>=0&&n<30&&!seen.has(n)&&board[n]===symbol){seen.add(n);stack.push(n)}})}if(group.length>=5)wins.push(group)}return wins}
function collapse(board,winners,marks){let set=new Set(winners),next=Array(30),fall=Array(30),step=60;for(let col=0;col<6;col++){let kept=[];for(let row=0;row<5;row++){let i=row*6+col;if(!set.has(i))kept.push({symbol:board[i],row})}let empty=5-kept.length;for(let row=0;row<5;row++){let i=row*6+col;if(row<empty){next[i]=symbols[Math.random()*symbols.length|0];fall[i]=-(empty-row)*step}else{let k=kept[row-empty];next[i]=k.symbol;fall[i]=-(row-k.row)*step}}}return{board:next,fall}}
async function playClassic(){if(busy)return;const free=freeCount>0;if(!free&&balance<wager)return toast('试玩余额不足');busy=true;$('#spin').disabled=true;$('#metricLabel').textContent='中奖奖金';$('#multiplier').textContent=money(0);$('#winAmount').textContent=money(0);$('#result').classList.remove('prize');boardEl.classList.add('roll');await pause(650);boardEl.classList.remove('roll');let board=randomClassicBoard();render(board,[],Array.from({length:25},(_,i)=>-100-Math.floor(i/5)*14));Array.from(boardEl.children).forEach(c=>c.classList.add('fall'));setTimeout(()=>Array.from(boardEl.children).forEach(c=>c.classList.remove('fall')),500);if(free){freeCount--;localStorage.setItem('slotFreeCount',freeCount)}else{balance=Math.round((balance-wager)*100)/100;paidCount++;if(paidCount>=500){paidCount=0;freeCount++;localStorage.setItem('slotFreeCount',freeCount);toast('获得 1 次免费游戏')}localStorage.setItem('slotPaidCount',paidCount);localStorage.setItem('slotBalance',balance)}showBalance();showFree();await pause(520);let prize=0,winners=[],activeRows=[2],lineBet=wager;for(const row of activeRows){let start=row*5,symbol=board[start],length=1;while(length<5&&board[start+length]===symbol)length++;if(length>=3){prize+=lineBet*(length===3?2:length===4?8:20);for(let col=0;col<length;col++)winners.push(start+col)}}winners.forEach(i=>boardEl.children[i].classList.add('win'));if(prize){prize=Math.round(prize*100)/100;$('#winAmount').textContent=money(prize);$('#multiplier').textContent=money(prize);balance=Math.round((balance+prize)*100)/100;localStorage.setItem('slotBalance',balance);$('#result').textContent=`中间线中奖 · 奖金 ${money(prize)}`;$('#result').classList.add('prize');showBalance()}else $('#result').textContent=`中间线未连中 3 个相同符号`;await pause(650);$('#spin').disabled=false;busy=false}async function play(){if(currentTheme==="ocean")return playClassic();if(busy)return;const free=freeCount>0;if(!free&&balance<wager)return toast('试玩余额不足');busy=true;$('#spin').disabled=true;$('#multiplier').textContent='0×';$('#winAmount').textContent=money(0);$('#result').classList.remove('prize');boardEl.classList.add('roll');await pause(650);boardEl.classList.remove('roll');let board=randomCandyBoard(),marks=Array(30).fill(0);render(board,marks,Array.from({length:30},(_,i)=>-110-Math.floor(i/6)*12));Array.from(boardEl.children).forEach(c=>c.classList.add('fall'));setTimeout(()=>Array.from(boardEl.children).forEach(c=>c.classList.remove('fall')),500);if(free){freeCount--;localStorage.setItem('slotFreeCount',freeCount)}else{balance=Math.round((balance-wager)*100)/100;paidCount++;if(paidCount>=500){paidCount=0;freeCount++;localStorage.setItem('slotFreeCount',freeCount);toast('获得 1 次免费游戏')}localStorage.setItem('slotPaidCount',paidCount);localStorage.setItem('slotBalance',balance)}showBalance();showFree();await pause(550);let total=0,wave=0;for(let cascade=0;cascade<10;cascade++){let groups=matches(board);if(!groups.length)break;wave++;let multiplier=wave*2,unitCount=groups.reduce((n,g)=>n+Math.floor(g.length/5),0),winners=groups.flat();total+=multiplier*unitCount;$('#multiplier').textContent=multiplier+'×';groups.forEach(g=>g.forEach(i=>{marks[i]=Math.max(marks[i],multiplier);let c=boardEl.children[i];c.classList.add('win');let tag=document.createElement('span');tag.className='token';tag.textContent=multiplier+'×';c.appendChild(tag)}));$('#result').textContent=`第 ${wave} 轮消除 · ${multiplier}×`;await pause(720);let next=collapse(board,winners,marks);board=next.board;render(board,marks,next.fall);Array.from(boardEl.children).forEach(c=>c.classList.add('fall'));setTimeout(()=>Array.from(boardEl.children).forEach(c=>c.classList.remove('fall')),500);await pause(520)}if(total){playWinSound();let win=Math.round(wager*total*100)/100;$('#winAmount').textContent=money(win);balance=Math.round((balance+win)*100)/100;localStorage.setItem('slotBalance',balance);$('#result').textContent=`总倍率 ${total}× · 赢得 ${money(win)}`;$('#result').classList.add('prize');showBalance()}else $('#result').textContent='没有形成 5 个相连的同种糖果';$('#spin').disabled=false;busy=false}
async function runFreeAuto(){if(freeAutoBusy)return;freeAutoBusy=true;while(freeCount>0){await play();if(freeCount>0){$("#spin").disabled=true;await pause(300)}}$("#spin").disabled=false;freeAutoBusy=false}function toast(message){let t=$('#toast');t.textContent=message;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}$('#betCurrent').onclick=()=>{let open=$('#betPicker').classList.toggle('open');$('#betCurrent').setAttribute('aria-expanded',String(open))};document.querySelectorAll('#betOptions button').forEach(button=>button.onclick=()=>{wager=Number(button.dataset.wager);updateBuyFree();$('#betCurrent').textContent='投注金额　RM '+wager.toFixed(2)+'　⌄';document.querySelectorAll('#betOptions button').forEach(b=>b.classList.toggle('active',b===button));$('#betPicker').classList.remove('open');$('#betCurrent').setAttribute('aria-expanded','false')});$('#spin').onclick=play;document.querySelector("#buyFree").onclick=()=>{if(busy||freeAutoBusy)return toast("本局结束后再购买");const cost=Math.round(wager*100*100)/100;if(balance<cost)return toast("试玩余额不足");balance=Math.round((balance-cost)*100)/100;freeCount+=10;purchaseCount++;localStorage.setItem("slotPurchaseCount",purchaseCount);localStorage.setItem("slotBalance",balance);localStorage.setItem("slotFreeCount",freeCount);showBalance();showFree();toast("已购买 10 次免费游戏，扣除 "+money(cost));runFreeAuto()};render(randomBoard());showBalance();showFree();
const themes={sweet:{title:'SWEET<br>SPIN',subtitle:'糖果甜心 · 连消玩法',symbols:['🍬','🍭','🍡','🍩','🍒','🍇','🍓']},ocean:{title:'OCEAN<br>POP',subtitle:'深海宝藏 · 传统转轴 5×5',symbols:['🐠','🐚','🪸','🐙','🦀','💎','🫧']},cosmic:{title:'COSMIC<br>CANDY',subtitle:'银河糖果 · 连消玩法',symbols:['🪐','🚀','⭐','🌙','☄️','💫','🛰️']}};
document.querySelectorAll('.game-option').forEach(card=>card.onclick=()=>{let theme=themes[card.dataset.theme];currentTheme=card.dataset.theme;symbols.splice(0,symbols.length,...theme.symbols);document.getElementById("metricLabel").textContent=card.dataset.theme==="ocean"?"中奖奖金":"当前倍率";document.getElementById("multiplier").textContent=card.dataset.theme==="ocean"?money(0):"0×";$('#gameTitle').innerHTML=theme.title;$('#gameSubtitle').textContent=theme.subtitle;document.getElementById("rules").textContent=card.dataset.theme==="ocean"?"5列5行传统老虎机玩法，仅启用盘面中间一条横向线路；从最左侧连成3、4或5个相同符号即可派彩，中奖按本次总投注计算；不触发糖果连消倍率。":"同一种糖果上下或左右相邻连成一组，5 个起消除并连锁补位；倍率留格。";document.body.classList.remove('lobby-mode');document.body.classList.toggle('neon-mode',card.dataset.theme==='sweet');$('#machine').classList.remove('sweet','ocean','cosmic');$('#machine').classList.add(card.dataset.theme);$('#slotLobby').style.display='none';$('#machine').style.display='block';$('#openLobby').style.display='inline-block';render(randomBoard())});
$('#openLobby').onclick=()=>{document.body.classList.add('lobby-mode');document.body.classList.remove('neon-mode');$('#machine').style.display='none';$('#slotLobby').style.display='block';$('#openLobby').style.display='none'};</script></body></html>
