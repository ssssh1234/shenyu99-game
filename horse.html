<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>马票 · 曜石娱乐</title><style>
*{box-sizing:border-box}body{margin:0;background:#11100c;color:#f1eee6;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 20px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.top a{color:#d7c29c;text-decoration:none;font-size:13px}.tag{font-size:10px;color:#e8bd69;border:1px solid #e8bd6955;padding:6px 9px;border-radius:16px}.hero{padding:35px 0 23px}.hero h1{font-size:27px;margin:0 0 8px}.hero p{color:#9b9484;font-size:12px;margin:0}.wallet{color:#e4c478;margin-top:13px;font-size:12px}.panel{border:1px solid #423b2d;background:linear-gradient(145deg,#211e17,#171610);border-radius:10px;padding:20px}.horses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.horse{border:1px solid #514631;border-radius:7px;background:#282419;color:#e8e1d2;padding:17px 10px;text-align:center;cursor:pointer;transition:.15s}.horse:hover,.horse.selected{border-color:#e7c372;background:#41351c;box-shadow:0 0 15px #d39d3240}.horse .icon{font-size:23px}.horse strong{display:block;font-size:13px;margin-top:7px}.horse small{color:#a69a7e;font-size:10px}.summary{display:flex;align-items:center;justify-content:space-between;color:#c5b99e;font-size:12px;margin:17px 0}.run{border:0;background:linear-gradient(#f4d181,#c78d37);color:#30200b;border-radius:5px;padding:12px 20px;font-weight:800;cursor:pointer}.run:disabled{opacity:.55;cursor:wait}.track{display:none;margin:18px 0 3px;padding:15px;border-radius:6px;background:repeating-linear-gradient(0deg,#38402b,#38402b 24px,#2c3523 24px,#2c3523 48px);overflow:hidden}.lane{height:28px;border-bottom:1px dashed #d7d0a444;position:relative}.runner{position:absolute;left:0;top:1px;font-size:20px;transition:left 1.5s cubic-bezier(.1,.7,.2,1)}.finish{position:absolute;right:8px;top:0;bottom:0;border-right:3px solid #f3dfad}.result{min-height:26px;text-align:center;font-size:13px;color:#f0cf83;padding-top:14px}.note{text-align:center;color:#796f5b;font-size:10px;margin:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;padding:10px 14px;background:#282218;border:1px solid #8a6b31;border-radius:8px;font-size:12px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.wrap{padding:0 11px}.panel{padding:13px}.horses{grid-template-columns:repeat(3,1fr)}.horse{padding:13px 6px}}
</style></head><body><div class="wrap"><header class="top"><a href="index.html">← 主页</a><span class="tag">马票独立应用 · 虚拟积分</span></header><section class="hero"><h1>赛马场 · 马票</h1><p>选出你看好的赛马，开始一场独立演示。</p><div class="wallet">试玩积分：<b id="balance">10,000</b></div></section><main class="panel"><div class="horses" id="horses"></div><div class="summary"><span id="selection">已选 0 匹</span><span>每注 100 积分</span></div><button id="run" class="run">购买演示马票 · 100 积分</button><div id="track" class="track"><span class="finish"></span></div><div id="result" class="result"></div></main><p class="note">独立游戏页面 · 仅使用虚拟积分，不涉及真实资金</p></div><div id="toast" class="toast"></div><script>
let balance=10000,chosen=new Set(),running=false;const $=s=>document.querySelector(s);function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}for(let n=1;n<=12;n++){let b=document.createElement('button');b.className='horse';b.innerHTML=`<span class="icon">🏇</span><strong>${String(n).padStart(2,'0')} 号赛马</strong><small>选择号码</small>`;b.onclick=()=>{if(running)return;if(chosen.has(n)){chosen.delete(n);b.classList.remove('selected')}else{chosen.add(n);b.classList.add('selected')}$('#selection').textContent='已选 '+chosen.size+' 匹'};$('#horses').appendChild(b)}$('#run').onclick=async()=>{if(running)return;if(!chosen.size)return toast('先选择至少一匹赛马');if(balance<100)return toast('试玩积分不足');running=true;balance-=100;$('#balance').textContent=balance.toLocaleString();$('#run').disabled=true;$('#result').textContent='比赛开始！';let track=$('#track');track.style.display='block';track.innerHTML='<span class="finish"></span>';let lanes=[];for(let i=1;i<=12;i++){let lane=document.createElement('div');lane.className='lane';let runner=document.createElement('span');runner.className='runner';runner.textContent='🏇';lane.appendChild(runner);track.appendChild(lane);lanes.push(runner)}await new Promise(r=>setTimeout(r,120));lanes.forEach(r=>r.style.left=(Math.random()*78+7)+'%');await new Promise(r=>setTimeout(r,1700));let winner=Math.ceil(Math.random()*12),didWin=chosen.has(winner);if(didWin){let prize=500;balance+=prize;$('#result').textContent=`🎉 ${winner} 号率先冲线！你赢得 ${prize} 虚拟积分`}else $('#result').textContent=`${winner} 号赛马率先冲线，再试一次`;$('#balance').textContent=balance.toLocaleString();running=false;$('#run').disabled=false};</script></body></html>
